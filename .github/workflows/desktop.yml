name: desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build dmg
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/Markdown-Viewer-*-macos-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build exe
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Markdown-Viewer-*-windows-x64.exe

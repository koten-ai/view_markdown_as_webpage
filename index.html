<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1712'/%3E%3Cpath d='M8 22V10h3.2l4.6 7.4V10H19v12h-3.2L11.2 14.6V22H8z' fill='%23f4efe4'/%3E%3Ccircle cx='24' cy='11' r='2.2' fill='%23c45c26'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,ital,wght@8..60,0,400;8..60,0,600;8..60,1,400;8..60,1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <a class="skip" href="#doc">Skip to document</a>
  <div class="app">
    <header class="top">
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open notes list" aria-controls="nav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="brand" id="brand" href="?doc=README.md">Markdown</a>
      <p class="crumb" id="crumb">README</p>
      <div class="type-ctrl" role="group" aria-label="Text size">
        <button type="button" id="type-down" title="Smaller text">A−</button>
        <button type="button" id="type-up" title="Bigger text">A+</button>
      </div>
    </header>

    <div class="shell">
      <aside id="nav" class="nav">
        <div id="nav-list"></div>
        <section class="legend" aria-label="Link colors">
          <p class="nav-kicker">Links</p>
          <p><span class="swatch local"></span> Local note — stays here</p>
          <p><span class="swatch grok"></span> Grokipedia — new tab</p>
          <p><span class="swatch ext"></span> Other site — ↗ new tab</p>
          <p class="hint">Click a picture to enlarge.</p>
        </section>
      </aside>
      <div class="scrim" id="scrim" hidden></div>
      <main class="main">
        <article id="doc" class="markdown" data-type="1">Loading…</article>
      </main>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lb-close" id="lb-close" aria-label="Close image">Close</button>
    <img id="lb-img" alt="" />
    <p class="lb-cap" id="lb-cap"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
  <script defer src="viewer.js"></script>
</body>
</html>

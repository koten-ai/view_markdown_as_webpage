<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a folder · Markdown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c2733'/%3E%3Crect x='6' y='6' width='20' height='20' rx='5' fill='%2300b4e6'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='12' font-family='Inter,Arial' font-weight='700' fill='%23fff'%3EMd%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body class="splash-body">
  <header class="splash-top">
    <a class="logo" href="/">
      <span class="logo-mark">Md</span>
      <span class="logo-name">Markdown</span>
    </a>
    <p class="splash-tag">Pick a folder of notes to view</p>
    <span class="app-version" id="app-version" hidden></span>
  </header>

  <main class="splash">
    <section class="splash-card" aria-label="Recent folders">
      <p class="splash-kicker">Recent</p>
      <div id="recent" class="recent-list"></div>
      <p class="splash-empty" id="recent-empty">No recent folders yet. Browse below, then View.</p>
    </section>

    <section class="splash-card splash-browser" aria-label="Folder browser">
      <p class="splash-kicker">This computer</p>
      <div class="splash-shortcuts" id="shortcuts"></div>
      <form class="path-row" id="path-form">
        <label class="visually-hidden" for="path-input">Folder path</label>
        <input id="path-input" type="text" spellcheck="false" autocomplete="off" />
        <button type="submit" class="ghost-btn">Go</button>
      </form>
      <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      <div class="dir-list" id="dirs"></div>
      <p class="dir-empty" id="dir-empty" hidden>No subfolders here.</p>
      <div class="splash-foot">
        <p class="md-count" id="md-count"></p>
        <button type="button" class="view-btn" id="view-btn">View this folder</button>
      </div>
      <p class="splash-err" id="err" hidden></p>
    </section>
  </main>

  <script src="splash.js"></script>
</body>
</html>
